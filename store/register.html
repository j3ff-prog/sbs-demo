<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Register — SBS Advertising</title>
<link href="https://fonts.googleapis.com/css2?family=DM+Sans:wght@400;500;600&display=swap" rel="stylesheet">
<link rel="stylesheet" href="../static/css/store-shared.css">
<style>
  .auth-page { min-height: calc(100vh - 64px); display: flex; align-items: center; justify-content: center; padding: 40px 20px; background: #F4F6F8; }
  .auth-card { background: #fff; border-radius: 16px; border: 1px solid #E8ECF0; padding: 40px; width: 100%; max-width: 440px; }
  .auth-logo { text-align: center; margin-bottom: 28px; }
  .auth-logo-box { width: 48px; height: 48px; background: var(--brand); border-radius: 12px; display: flex; align-items: center; justify-content: center; font-size: 15px; font-weight: 700; color: #fff; margin: 0 auto 12px; }
  .auth-title { font-size: 22px; font-weight: 700; color: #1A1A2E; margin-bottom: 4px; }
  .auth-sub { font-size: 13.5px; color: #8A93A0; }
  .form-grid { display: grid; grid-template-columns: 1fr 1fr; gap: 14px; }
  .form-group { margin-bottom: 0; }
  .form-group.full { grid-column: 1/-1; }
  .form-group label { display: block; font-size: 13px; font-weight: 500; color: #4A5260; margin-bottom: 6px; }
  .form-group input { width: 100%; height: 42px; border: 1px solid #D8DDE4; border-radius: 8px; padding: 0 14px; font-size: 14px; font-family: var(--font); color: #1A1A2E; outline: none; transition: border-color 0.15s; }
  .form-group input:focus { border-color: var(--brand); }
  .submit-btn { width: 100%; height: 44px; justify-content: center; font-size: 15px; margin-top: 20px; }
  .auth-switch { text-align: center; margin-top: 20px; font-size: 13.5px; color: #7A8491; }
  .auth-switch a { color: var(--brand); font-weight: 500; }
  .error-msg { background: #FEF0F0; border: 1px solid #FBBCBC; color: #C0291F; padding: 10px 14px; border-radius: 8px; font-size: 13px; margin-bottom: 16px; display: none; }
  .terms { font-size: 12px; color: #9AA3AF; text-align: center; margin-top: 14px; line-height: 1.5; }
</style>
</head>
<body>
<nav class="nav" id="nav-mount"></nav>
<div class="auth-page">
  <div class="auth-card">
    <div class="auth-logo">
      <div class="auth-logo-box">SBS</div>
      <div class="auth-title">Create account</div>
      <div class="auth-sub">Join SBS Advertising</div>
    </div>
    <div class="error-msg" id="error-msg"></div>
    <div class="form-grid">
      <div class="form-group full">
        <label>Full name</label>
        <input type="text" id="f-name" placeholder="James Mwangi">
      </div>
      <div class="form-group full">
        <label>Email address</label>
        <input type="email" id="f-email" placeholder="james@example.com">
      </div>
      <div class="form-group full">
        <label>Phone number</label>
        <input type="text" id="f-phone" placeholder="07XX XXX XXX">
      </div>
      <div class="form-group">
        <label>Password</label>
        <input type="password" id="f-password" placeholder="••••••••">
      </div>
      <div class="form-group">
        <label>Confirm password</label>
        <input type="password" id="f-confirm" placeholder="••••••••">
      </div>
    </div>
    <button class="btn btn-primary submit-btn" onclick="register()">Create account</button>
    <div class="terms">By creating an account you agree to our Terms of Service and Privacy Policy.</div>
    <div class="auth-switch">Already have an account? <a href="login.html">Log in</a></div>
  </div>
</div>
<footer class="footer"><div id="footer-mount"></div></footer>
<script src="../static/js/store-shared.js"></script>
<script>
  renderNav('home');
  renderFooter();
  if (isLoggedIn()) location.href = 'index.html';

  function register() {
    const name = document.getElementById('f-name').value.trim();
    const email = document.getElementById('f-email').value.trim();
    const phone = document.getElementById('f-phone').value.trim();
    const password = document.getElementById('f-password').value;
    const confirm = document.getElementById('f-confirm').value;
    const errEl = document.getElementById('error-msg');
    errEl.style.display = 'none';
    if (!name || !email || !phone || !password) { errEl.textContent = 'Please fill in all fields.'; errEl.style.display = 'block'; return; }
    if (password !== confirm) { errEl.textContent = 'Passwords do not match.'; errEl.style.display = 'block'; return; }
    const customers = JSON.parse(localStorage.getItem('sbs_customers') || '[]');
    if (customers.find(c => c.email === email)) { errEl.textContent = 'An account with that email already exists.'; errEl.style.display = 'block'; return; }
    const newCustomer = { id: Date.now().toString(), full_name: name, email, phone, password, created_at: new Date().toISOString() };
    customers.push(newCustomer);
    localStorage.setItem('sbs_customers', JSON.stringify(customers));
    setSession({ id: newCustomer.id, full_name: name, email, phone });
    location.href = 'index.html';
  }
</script>
</body>
</html>
