<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Cart — SBS Advertising</title>
<link href="https://fonts.googleapis.com/css2?family=DM+Sans:wght@400;500;600&display=swap" rel="stylesheet">
<link rel="stylesheet" href="../static/css/store-shared.css">
<style>
  .page-wrap { max-width: 1200px; margin: 0 auto; padding: 36px 40px; }
  .page-title { font-size: 24px; font-weight: 700; color: #1A1A2E; margin-bottom: 28px; }
  .cart-layout { display: grid; grid-template-columns: 1fr 340px; gap: 24px; }
  .cart-items { background: #fff; border-radius: 14px; border: 1px solid #E8ECF0; overflow: hidden; }
  .cart-header { padding: 16px 24px; border-bottom: 1px solid #F0F3F6; display: grid; grid-template-columns: 2fr 1fr 1fr 1fr 40px; gap: 12px; font-size: 11px; font-weight: 600; text-transform: uppercase; letter-spacing: 0.07em; color: #8A93A0; }
  .cart-row { display: grid; grid-template-columns: 2fr 1fr 1fr 1fr 40px; gap: 12px; align-items: center; padding: 18px 24px; border-bottom: 1px solid #F4F6F8; transition: background 0.1s; }
  .cart-row:last-child { border-bottom: none; }
  .cart-row:hover { background: #FAFBFC; }
  .cart-product { display: flex; align-items: center; gap: 14px; }
  .cart-img { width: 60px; height: 60px; border-radius: 10px; background: #F4F6F8; border: 1px solid #E8ECF0; display: flex; align-items: center; justify-content: center; flex-shrink: 0; overflow: hidden; }
  .cart-img img { width: 100%; height: 100%; object-fit: cover; }
  .cart-img svg { width: 26px; height: 26px; color: #C0C8D2; }
  .cart-item-name { font-size: 14px; font-weight: 500; color: #1A1A2E; line-height: 1.3; }
  .cart-item-cat { font-size: 12px; color: #9AA3AF; margin-top: 2px; }
  .cart-price { font-size: 14px; font-weight: 500; color: #1A1A2E; }
  .qty-control { display: flex; align-items: center; border: 1px solid #E0E5EB; border-radius: 8px; overflow: hidden; width: fit-content; }
  .qty-btn { width: 30px; height: 32px; border: none; background: #F8FAFB; cursor: pointer; font-size: 16px; color: #5A6473; display: flex; align-items: center; justify-content: center; transition: all 0.15s; }
  .qty-btn:hover { background: var(--brand-light); color: var(--brand); }
  .qty-val { width: 36px; height: 32px; text-align: center; border: none; border-left: 1px solid #E0E5EB; border-right: 1px solid #E0E5EB; font-size: 13px; font-family: var(--font); background: #fff; color: #1A1A2E; outline: none; }
  .cart-total { font-size: 14px; font-weight: 600; color: var(--brand-dark); }
  .remove-btn { width: 30px; height: 30px; border-radius: 6px; border: 1px solid #F0C0C0; background: transparent; cursor: pointer; display: flex; align-items: center; justify-content: center; color: #C0291F; transition: all 0.15s; }
  .remove-btn:hover { background: #FEF0F0; }
  .remove-btn svg { width: 14px; height: 14px; }
  .cart-empty { padding: 80px 20px; text-align: center; }
  .cart-empty svg { color: #C0C8D2; }
  .cart-empty h3 { font-size: 18px; font-weight: 600; color: #1A1A2E; margin: 16px 0 8px; }
  .cart-empty p { font-size: 14px; color: #8A93A0; margin-bottom: 24px; }
  /* SUMMARY */
  .cart-summary { background: #fff; border-radius: 14px; border: 1px solid #E8ECF0; padding: 24px; height: fit-content; position: sticky; top: 80px; }
  .summary-title { font-size: 16px; font-weight: 600; color: #1A1A2E; margin-bottom: 20px; }
  .summary-row { display: flex; justify-content: space-between; font-size: 13.5px; padding: 8px 0; border-bottom: 1px solid #F4F6F8; }
  .summary-row:last-of-type { border-bottom: none; }
  .summary-row.total { font-size: 16px; font-weight: 700; color: #1A1A2E; border-top: 2px solid #E8ECF0; padding-top: 14px; margin-top: 6px; }
  .summary-label { color: #7A8491; }
  .checkout-btn { width: 100%; justify-content: center; height: 48px; font-size: 15px; margin-top: 16px; }
  .continue-link { display: block; text-align: center; font-size: 13px; color: var(--brand); margin-top: 12px; cursor: pointer; }
  .continue-link:hover { text-decoration: underline; }
  .promo-row { display: flex; gap: 8px; margin: 16px 0; }
  .promo-row input { flex: 1; height: 38px; border: 1px solid #E0E5EB; border-radius: 8px; padding: 0 12px; font-size: 13px; font-family: var(--font); outline: none; }
  .promo-row input:focus { border-color: var(--brand); }
  .payment-icons { display: flex; align-items: center; gap: 8px; margin-top: 14px; justify-content: center; }
  .payment-icon { height: 24px; padding: 3px 8px; background: #F8FAFB; border: 1px solid #E8ECF0; border-radius: 4px; font-size: 10px; font-weight: 600; color: #5A6473; display: flex; align-items: center; }

  /* ===== RESPONSIVE ===== */
  @media (max-width: 768px) {
    .cart-layout { flex-direction: column !important; grid-template-columns: 1fr !important; }
    .cart-main { min-width: 0; }
    .container { padding: 0 16px; }
    .cart-item { flex-wrap: wrap; gap: 10px; }
  }

</style>
</head>
<body>
<nav class="nav" id="nav-mount"></nav>
<div class="page-wrap">
  <div class="page-title">Shopping cart</div>
  <div class="cart-layout" id="cart-layout">
    <div class="cart-items" id="cart-items-panel"></div>
    <div class="cart-summary" id="cart-summary"></div>
  </div>
</div>
<footer class="footer"><div id="footer-mount"></div></footer>
<script src="../static/js/store-shared.js"></script>
<script>
  renderNav('home');
  renderFooter();

  function renderCart() {
    updateCartCount();
    const cart = getCart();
    const itemsPanel = document.getElementById('cart-items-panel');
    const summaryPanel = document.getElementById('cart-summary');

    if (!cart.length) {
      document.getElementById('cart-layout').style.gridTemplateColumns = '1fr';
      summaryPanel.style.display = 'none';
      itemsPanel.innerHTML = `<div class="cart-empty">
        <svg width="64" height="64" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.2"><circle cx="9" cy="21" r="1"/><circle cx="20" cy="21" r="1"/><path d="M1 1h4l2.68 13.39a2 2 0 002 1.61h9.72a2 2 0 002-1.61L23 6H6"/></svg>
        <h3>Your cart is empty</h3>
        <p>You haven't added any products yet.</p>
        <a href="index.html" class="btn btn-primary">Continue shopping</a>
      </div>`; return;
    }

    const subtotal = cartSubtotal();
    const tax = subtotal * 0.16;
    const total = subtotal + tax;

    itemsPanel.innerHTML = `
      <div class="cart-header"><span>Product</span><span>Price</span><span>Quantity</span><span>Total</span><span></span></div>
      ${cart.map(item => `
        <div class="cart-row">
          <div class="cart-product">
            <div class="cart-img">${item.image?`<img src="${item.image}" alt="${item.name}" onerror="this.parentElement.innerHTML='<svg width=26 height=26 viewBox=&quot;0 0 24 24&quot; fill=&quot;none&quot; stroke=&quot;#C0C8D2&quot; stroke-width=&quot;1.5&quot;><rect x=&quot;3&quot; y=&quot;3&quot; width=&quot;18&quot; height=&quot;18&quot; rx=&quot;2&quot;/></svg>';">`:'<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.5"><rect x="3" y="3" width="18" height="18" rx="2"/><circle cx="8.5" cy="8.5" r="1.5"/><polyline points="21 15 16 10 5 21"/></svg>'}</div>
            <div><div class="cart-item-name">${item.name}</div><div class="cart-item-cat">${item.category||''}</div></div>
          </div>
          <div class="cart-price">${fmtAmt(item.price)}</div>
          <div>
            <div class="qty-control">
              <button class="qty-btn" onclick="changeQty('${item.product_id}',-1)">−</button>
              <input class="qty-val" type="number" value="${item.quantity}" min="1" onchange="setQty('${item.product_id}',this.value)">
              <button class="qty-btn" onclick="changeQty('${item.product_id}',1)">+</button>
            </div>
          </div>
          <div class="cart-total">${fmtAmt(item.price * item.quantity)}</div>
          <button class="remove-btn" onclick="removeItem('${item.product_id}')">
            <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><polyline points="3 6 5 6 21 6"/><path d="M19 6l-1 14a2 2 0 01-2 2H8a2 2 0 01-2-2L5 6"/><path d="M10 11v6M14 11v6"/></svg>
          </button>
        </div>`).join('')}`;

    summaryPanel.innerHTML = `
      <div class="summary-title">Order summary</div>
      <div class="summary-row"><span class="summary-label">Items (${cart.reduce((s,i)=>s+i.quantity,0)})</span><span>${fmtAmt(subtotal)}</span></div>
      <div class="summary-row"><span class="summary-label">VAT (16%)</span><span>${fmtAmt(tax)}</span></div>
      <div class="summary-row"><span class="summary-label">Delivery</span><span style="color:#1A6B38;">Free</span></div>
      <div class="summary-row total"><span>Total</span><span>${fmtAmt(total)}</span></div>
      <a href="checkout.html"><button class="btn btn-accent checkout-btn">Proceed to checkout →</button></a>
      <a href="index.html" class="continue-link">Continue shopping</a>
      <div style="border-top:1px solid #F0F3F6;margin-top:16px;padding-top:14px;">
        <div style="font-size:12px;color:#8A93A0;margin-bottom:8px;text-align:center;">We accept</div>
        <div class="payment-icons">
          <div class="payment-icon">M-Pesa</div>
          <div class="payment-icon">Visa</div>
          <div class="payment-icon">Mastercard</div>
        </div>
      </div>`;
  }

  function changeQty(id, delta) { const c=getCart(),i=c.find(x=>x.product_id===id); if(i){i.quantity=Math.max(1,i.quantity+delta);saveCart(c);} renderCart(); }
  function setQty(id, val) { const c=getCart(),i=c.find(x=>x.product_id===id); if(i){i.quantity=Math.max(1,parseInt(val)||1);saveCart(c);} renderCart(); }
  function removeItem(id) { removeFromCart(id); renderCart(); }

  renderCart();
</script>
</body>
</html>
