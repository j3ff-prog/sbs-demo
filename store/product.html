<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Product — SBS Advertising</title>
<link href="https://fonts.googleapis.com/css2?family=DM+Sans:wght@400;500;600&display=swap" rel="stylesheet">
<link rel="stylesheet" href="../static/css/store-shared.css">
<style>
  .page-wrap { max-width: 1200px; margin: 0 auto; padding: 32px 40px; }
  .breadcrumb { display: flex; align-items: center; gap: 8px; font-size: 13px; color: #8A93A0; margin-bottom: 28px; }
  .breadcrumb a { color: var(--brand); }
  .breadcrumb span { color: #C0C8D2; }
  .product-layout { display: grid; grid-template-columns: 1fr 1fr; gap: 48px; margin-bottom: 48px; }
  .product-images { }
  .main-image { width: 100%; aspect-ratio: 1; background: #F4F6F8; border-radius: 16px; border: 1px solid #E8ECF0; display: flex; align-items: center; justify-content: center; overflow: hidden; }
  .main-image img { width: 100%; height: 100%; object-fit: cover; border-radius: 16px; }
  .main-image svg { width: 80px; height: 80px; color: #C0C8D2; }
  .product-details { display: flex; flex-direction: column; gap: 0; }
  .product-cat-tag { display: inline-flex; align-items: center; background: var(--brand-light); color: var(--brand-dark); font-size: 11.5px; font-weight: 500; padding: 4px 12px; border-radius: 20px; margin-bottom: 12px; width: fit-content; }
  .product-title { font-size: 26px; font-weight: 700; color: #1A1A2E; line-height: 1.2; margin-bottom: 12px; }
  .product-price-big { font-size: 30px; font-weight: 700; color: var(--brand-dark); margin-bottom: 20px; }
  .product-meta { display: flex; flex-direction: column; gap: 0; background: #F8FAFB; border-radius: 12px; padding: 16px; margin-bottom: 20px; }
  .meta-row { display: flex; align-items: center; justify-content: space-between; padding: 8px 0; border-bottom: 1px solid #F0F3F6; font-size: 13.5px; }
  .meta-row:last-child { border-bottom: none; }
  .meta-key { color: #7A8491; }
  .meta-val { font-weight: 500; color: #1A1A2E; }
  .stock-indicator { display: flex; align-items: center; gap: 6px; }
  .stock-dot { width: 8px; height: 8px; border-radius: 50%; }
  .stock-dot.good { background: #1A6B38; }
  .stock-dot.low { background: #C07A10; }
  .stock-dot.out { background: #C0291F; }
  .qty-selector { display: flex; align-items: center; gap: 12px; margin-bottom: 20px; }
  .qty-label { font-size: 13.5px; font-weight: 500; color: #4A5260; }
  .qty-control { display: flex; align-items: center; border: 1px solid #E0E5EB; border-radius: 8px; overflow: hidden; }
  .qty-btn { width: 36px; height: 40px; border: none; background: #F8FAFB; cursor: pointer; font-size: 18px; color: #5A6473; display: flex; align-items: center; justify-content: center; transition: all 0.15s; }
  .qty-btn:hover { background: var(--brand-light); color: var(--brand); }
  .qty-val { width: 48px; height: 40px; text-align: center; border: none; border-left: 1px solid #E0E5EB; border-right: 1px solid #E0E5EB; font-size: 14px; font-weight: 500; font-family: var(--font); background: #fff; color: #1A1A2E; outline: none; }
  .cta-buttons { display: flex; flex-direction: column; gap: 10px; }
  .btn-add-cart { width: 100%; justify-content: center; height: 48px; font-size: 15px; }
  .btn-buy-now { width: 100%; justify-content: center; height: 48px; font-size: 15px; background: var(--navy); color: #fff; }
  .btn-buy-now:hover { background: #1A2F45; }
  .trust-badges { display: flex; gap: 16px; margin-top: 20px; }
  .trust-badge { display: flex; align-items: center; gap: 6px; font-size: 12px; color: #7A8491; }
  .trust-badge svg { width: 15px; height: 15px; color: var(--brand); }
  .description-section { background: #fff; border-radius: 12px; border: 1px solid #E8ECF0; padding: 24px 28px; }
  .desc-title { font-size: 16px; font-weight: 600; color: #1A1A2E; margin-bottom: 14px; }
  .desc-text { font-size: 14px; color: #5A6473; line-height: 1.8; }
  .related-section { margin-top: 40px; }
  .section-title { font-size: 18px; font-weight: 600; color: #1A1A2E; margin-bottom: 20px; }
  .related-grid { display: grid; grid-template-columns: repeat(4, 1fr); gap: 14px; }
  .related-card { background: #fff; border-radius: 10px; border: 1px solid #E8ECF0; overflow: hidden; cursor: pointer; transition: all 0.15s; }
  .related-card:hover { border-color: var(--brand); transform: translateY(-2px); }
  .related-img { width: 100%; aspect-ratio: 4/3; background: #F4F6F8; display: flex; align-items: center; justify-content: center; overflow: hidden; }
  .related-img img { width: 100%; height: 100%; object-fit: cover; }
  .related-img svg { width: 36px; height: 36px; color: #C0C8D2; }
  .related-info { padding: 10px 12px; }
  .related-name { font-size: 13px; font-weight: 500; color: #1A1A2E; line-height: 1.3; margin-bottom: 4px; }
  .related-price { font-size: 13px; font-weight: 600; color: var(--brand-dark); }
</style>
</head>
<body>
<nav class="nav" id="nav-mount"></nav>
<div class="page-wrap">
  <div class="breadcrumb">
    <a href="index.html">Shop</a>
    <span>/</span>
    <span id="bc-cat">Category</span>
    <span>/</span>
    <span id="bc-name" style="color:#1A1A2E;">Product</span>
  </div>
  <div class="product-layout">
    <div class="product-images">
      <div class="main-image" id="main-image">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.5"><rect x="3" y="3" width="18" height="18" rx="2"/><circle cx="8.5" cy="8.5" r="1.5"/><polyline points="21 15 16 10 5 21"/></svg>
      </div>
    </div>
    <div class="product-details">
      <span class="product-cat-tag" id="p-cat">Category</span>
      <div class="product-title" id="p-name">Loading...</div>
      <div class="product-price-big" id="p-price">KES 0</div>
      <div class="product-meta">
        <div class="meta-row"><span class="meta-key">Availability</span><span class="meta-val" id="p-stock-label"><div class="stock-indicator"><span class="stock-dot good"></span>In stock</div></span></div>
        <div class="meta-row"><span class="meta-key">Category</span><span class="meta-val" id="p-cat2">—</span></div>
        <div class="meta-row"><span class="meta-key">SKU</span><span class="meta-val" id="p-sku" style="font-family:monospace;font-size:12px;">—</span></div>
      </div>
      <div class="qty-selector">
        <span class="qty-label">Quantity</span>
        <div class="qty-control">
          <button class="qty-btn" onclick="adjustQty(-1)">−</button>
          <input type="number" class="qty-val" id="qty-input" value="1" min="1">
          <button class="qty-btn" onclick="adjustQty(1)">+</button>
        </div>
      </div>
      <div class="cta-buttons">
        <button class="btn btn-primary btn-add-cart" id="add-cart-btn" onclick="handleAddToCart()">
          <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><circle cx="9" cy="21" r="1"/><circle cx="20" cy="21" r="1"/><path d="M1 1h4l2.68 13.39a2 2 0 002 1.61h9.72a2 2 0 002-1.61L23 6H6"/></svg>
          Add to cart
        </button>
        <button class="btn btn-buy-now" onclick="buyNow()">Buy now — pay via M-Pesa or card</button>
      </div>
      <div class="trust-badges">
        <div class="trust-badge"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M12 22s8-4 8-10V5l-8-3-8 3v7c0 6 8 10 8 10z"/></svg>Secure payment</div>
        <div class="trust-badge"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><rect x="1" y="3" width="15" height="13"/><polygon points="16 8 20 8 23 11 23 16 16 16 16 8"/><circle cx="5.5" cy="18.5" r="2.5"/><circle cx="18.5" cy="18.5" r="2.5"/></svg>Fast delivery</div>
        <div class="trust-badge"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><polyline points="20 6 9 17 4 12"/></svg>Genuine products</div>
      </div>
    </div>
  </div>
  <div class="description-section">
    <div class="desc-title">Product description</div>
    <div class="desc-text" id="p-desc">Loading product details...</div>
  </div>
  <div class="related-section">
    <div class="section-title">You may also like</div>
    <div class="related-grid" id="related-grid"></div>
  </div>
</div>
<footer class="footer"><div id="footer-mount"></div></footer>
<script src="../static/js/store-shared.js"></script>
<script>
  renderNav('home');
  renderFooter();
  updateCartCount();

  const params = new URLSearchParams(location.search);
  const productId = params.get('id');
  const products = JSON.parse(localStorage.getItem('sbs_products') || '[]');
  const product = products.find(p => p.id == productId);

  if (!product) {
    document.querySelector('.product-layout').innerHTML = '<div style="text-align:center;padding:60px;grid-column:1/-1;"><p style="color:#8A93A0;font-size:15px;">Product not found. <a href="index.html" style="color:var(--brand);">Back to shop</a></p></div>';
  } else {
    document.title = product.name + ' — SBS Advertising';
    document.getElementById('bc-cat').textContent = product.category || 'Products';
    document.getElementById('bc-name').textContent = product.name;
    document.getElementById('p-cat').textContent = product.category || 'General';
    document.getElementById('p-cat2').textContent = product.category || '—';
    document.getElementById('p-name').textContent = product.name;
    document.getElementById('p-price').textContent = fmtAmt(product.price);
    document.getElementById('p-desc').textContent = product.description || 'Quality product from SBS Advertising Ltd.';
    document.getElementById('p-sku').textContent = 'SBS-' + product.id;
    const stockEl = document.getElementById('p-stock-label');
    if (product.stock === 0) { stockEl.innerHTML = '<div class="stock-indicator"><span class="stock-dot out"></span>Out of stock</div>'; document.getElementById('add-cart-btn').disabled = true; document.getElementById('add-cart-btn').style.opacity = '0.5'; }
    else if (product.stock <= 5) { stockEl.innerHTML = `<div class="stock-indicator"><span class="stock-dot low"></span>Low stock (${product.stock} left)</div>`; }
    else { stockEl.innerHTML = `<div class="stock-indicator"><span class="stock-dot good"></span>In stock (${product.stock} available)</div>`; }
    if (product.image) {
      document.getElementById('main-image').innerHTML = `<img src="${product.image}" alt="${product.name}" onerror="this.parentElement.innerHTML='<svg width=80 height=80 viewBox=&quot;0 0 24 24&quot; fill=&quot;none&quot; stroke=&quot;#C0C8D2&quot; stroke-width=&quot;1.5&quot;><rect x=&quot;3&quot; y=&quot;3&quot; width=&quot;18&quot; height=&quot;18&quot; rx=&quot;2&quot;/></svg>';">`;
    }
    // Related products
    const related = products.filter(p => p.id != productId && (p.category === product.category || true) && p.active !== false).slice(0, 4);
    document.getElementById('related-grid').innerHTML = related.length
      ? related.map(p => `<div class="related-card" onclick="location.href='product.html?id=${p.id}'">
          <div class="related-img">${p.image?`<img src="${p.image}" alt="${p.name}">`:'<svg viewBox="0 0 24 24" fill="none" stroke="#C0C8D2" stroke-width="1.5"><rect x="3" y="3" width="18" height="18" rx="2"/></svg>'}</div>
          <div class="related-info"><div class="related-name">${p.name}</div><div class="related-price">${fmtAmt(p.price)}</div></div>
        </div>`).join('')
      : '<p style="color:#8A93A0;font-size:13px;grid-column:1/-1;">No related products yet.</p>';
  }

  function adjustQty(delta) {
    const input = document.getElementById('qty-input');
    const max = product ? product.stock : 1;
    input.value = Math.max(1, Math.min(max, parseInt(input.value||1) + delta));
  }
  function handleAddToCart() {
    if (!product) return;
    const qty = parseInt(document.getElementById('qty-input').value) || 1;
    addToCart(product, qty);
    showToast(product.name + ' added to cart');
  }
  function buyNow() {
    if (!product) return;
    handleAddToCart();
    location.href = 'cart.html';
  }
</script>
</body>
</html>
